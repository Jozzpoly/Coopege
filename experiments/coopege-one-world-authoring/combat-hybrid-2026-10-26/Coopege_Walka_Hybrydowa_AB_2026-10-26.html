function applyCSS_FS(on){
    cssFS=on;

        GC.style.position='fixed';GC.style.top='0';GC.style.left='0';
        GC.style.zIndex='99999';document.body.style.background='#000';

        GC.style.position='';GC.style.top='';GC.style.left='';
        GC.style.zIndex='';document.body.style.background='';
        FSB.textContent='⛶';FSB.title='Pełny ekran [F11]';
    }
    setTimeout(resize,80);
}
function toggleFS(){
    if(cssFS){applyCSS_FS(false);return;}
    if(document.fullscreenElement){document.exitFullscreen().catch(()=>{});return;}
    const tgt=document.documentElement;
    const req=tgt.requestFullscreen||tgt.webkitRequestFullscreen||tgt.mozRequestFullScreen;
    if(!req){applyCSS_FS(true);return;}
    try{
        const p=req.call(tgt,{navigationUI:'hide'});
        if(p&&typeof p.then==='function'){
            p.catch(()=>applyCSS_FS(true));
        } else {
            setTimeout(()=>{if(!document.fullscreenElement&&!cssFS)applyCSS_FS(true);},400);
        }
    }catch(err){applyCSS_FS(true);}
    if(isMob&&screen.orientation?.lock)screen.orientation.lock('landscape').catch(()=>{});
}

function buildExpandedAxis(srcSize,targetSize,inserts){
    const byAfter=new Map(inserts.map(v=>[v.after,v.count])),sourceForDest=[],start=Array(srcSize),span=Array(srcSize).fill(1);
    for(let s=0;s<srcSize;s++){
        start[s]=sourceForDest.length;sourceForDest.push(s);
        const extra=byAfter.get(s)||0;span[s]+=extra;for(let i=0;i<extra;i++)sourceForDest.push(s);
    }
    if(sourceForDest.length!==targetSize)throw new Error('Błędny plan rozszerzenia osi: '+sourceForDest.length+' zamiast '+targetSize);
    return{srcSize,targetSize,sourceForDest,start,span};
}

const WALKABLE_TILES=new Set([0,1,4,5,7,8,9,10,12,13,16]);
// Dynamic world objects are separate from the author's map raster.
// Neither exportWorld nor Studio undo serializes a movable object as a painted tile.
const DYNAMIC_COVER=new Set();
const coverKey=(z,x,y)=>z+':'+x+':'+y;
const blockedByObject=(z,x,y)=>DYNAMIC_COVER.has(coverKey(z,x,y));
const BLOCK_SHOT_TILES=new Set([2,6,11,15,17]);
function tileAt(tx,ty,z=ACTIVE_Z){return tx<0||ty<0||tx>=MW||ty>=MH?15:(MAPS[z]?.[ty]?.[tx]??15);}
function tclr(tx,ty,z=ACTIVE_Z){const t=tileAt(tx,ty,z),c=TC[t]||TC[0];return c[Math.abs((tx*31+ty*17+z*43)%c.length)];}
function walkable(tx,ty,z=ACTIVE_Z){return tx>=0&&ty>=0&&tx<MW&&ty<MH&&WALKABLE_TILES.has(tileAt(tx,ty,z))&&!blockedByObject(z,tx,ty);}
function canPlayerStandTile(tx,ty,z=ACTIVE_Z){return walkable(tx,ty,z)&&walkable(tx,ty+1,z);}
function shotPassable(tx,ty,z=ACTIVE_Z){return tx>=0&&ty>=0&&tx<MW&&ty<MH&&!BLOCK_SHOT_TILES.has(tileAt(tx,ty,z))&&!blockedByObject(z,tx,ty);}
function hasLineOfSight(ax,ay,bx,by,z=ACTIVE_Z){const d=Math.hypot(bx-ax,by-ay),steps=Math.max(1,Math.ceil(d/8));for(let i=1;i<steps;i++){const t=w2t(ax+(bx-ax)*i/steps,ay+(by-ay)*i/steps);if(!shotPassable(t.x,t.y,z))return false;}return true;}
function zoneAt(tx,ty,z=ACTIVE_Z){
    // Strefy są opisane w stabilnych współrzędnych projektowych, niezależnych od rozmiaru świata.
    tx=worldToDesignTile(tx,AXIS_X);ty=worldToDesignTile(ty,AXIS_Y);
    if(z===2)return tx>70?'Korona Lodowego Szczytu':'Obserwatorium Wieży';
    if(z===1)return tx>66?'Płaskowyż Białego Wiatru':tx>50?'Górne Piętra Twierdzy':'Mury i Dachy Twierdzy';
    if(z===-1){if(tx<34)return'Stare Kopalnie';if(tx<50)return'Kanały Twierdzy';if(tx<70)return'Katakumby Umarłych';return'Grobowiec Pustynnego Króla';}
    if(z===-2){if(tx<40)return'Zapomniany Szyb';if(tx<74)return'Sanktuarium Smoczego Ognia';return'Królewska Krypta';}
    if(tx>=67&&ty<=22)return'Śnieżne Góry';if(tx>=67&&ty>=23&&ty<=50)return'Pustynia Popiołu';
    if(ty>=51&&tx<50)return'Bagna Zmierzchu';if(tx>=50&&ty>=51)return'Cmentarz Umarłych';
    if(tx>=32&&tx<=62&&ty>=21&&ty<=48)return'Twierdza Srebrnej Bramy';if(tx<32&&ty<50)return'Las Starych Dębów';return'Dzika Kraina';

const QUEST={index:0,progress:0,completed:false};
const KILL_COUNTS={rat:0,troll:0,orc:0,skeleton:0,dragon:0,yeti:0};
function questCurrent(){return QUESTS[QUEST.index]||null;}
function giveItem(id){
    const it=EQUIP_DB[id];
    if(!it)return false;
    if(PL.inv.length>=MAX_INV){msg('Nagroda czeka, ale plecak jest pełny!','#ff8888');return false;}
    PL.inv.push(Object.assign({id},it));
    msg('🎁 Otrzymujesz: '+it.name,'#aaffcc');
    return true;
}
function rewardQuest(q){
    const r=q.reward||{},rewardId=r.item||(r.classReward?(PL.classKey==='warrior'?'sword_knight':PL.classKey==='archer'?'bow_dragon':'staff_arcane'):null);
    if(rewardId&&PL.inv.length>=MAX_INV){msg('🎒 Zwolnij miejsce w plecaku — nagroda za zadanie czeka.','#ffbb66');return false;}
    if(r.gold)PL.gold+=r.gold;
    if(r.hpot)PL.hpot+=r.hpot;
    if(r.mpot)PL.mpot+=r.mpot;
    if(r.talent)PL.talentPts+=r.talent;
    if(rewardId)giveItem(rewardId);
    const bits=[];if(r.gold)bits.push(r.gold+'g');if(r.talent)bits.push('+'+r.talent+' talent');if(r.hpot)bits.push('+'+r.hpot+' HP pot');if(r.mpot)bits.push('+'+r.mpot+' MP pot');
    msg('✅ Zadanie ukończone: '+q.name+(bits.length?' — '+bits.join(', '):''),'#66ff99');
    spFT(PL.x,PL.y-42,'ZADANIE UKOŃCZONE!','#66ff99');spP(PL.x,PL.y,28,'#66ff99',.8,4);vib([40,25,60]);return true;
}
function questOnKill(m){
    if(KILL_COUNTS[m.tk]!==undefined)KILL_COUNTS[m.tk]++;
    const q=questCurrent();if(!q||QUEST.completed||m.tk!==q.tk)return;
    QUEST.progress=Math.min(q.need,QUEST.progress+1);
    msg('📜 '+q.desc+': '+QUEST.progress+'/'+q.need,'#ffe088');
    if(QUEST.progress>=q.need){
        if(!rewardQuest(q))return;QUEST.index++;QUEST.progress=0;
        if(QUEST.index>=QUESTS.length){QUEST.completed=true;msg('🏆 Ukończyłeś cały szlak łowcy!','#ffdd44');}
        else msg('📜 Nowe zadanie: '+questCurrent().name+' — '+questCurrent().desc,'#ffe088');
    }
}

const PARTS=[],FT=[];
class Part{constructor(x,y,col,life,sz){this.x=x;this.y=y;this.col=col;this.life=life||.6;this.ml=this.life;this.vx=rndF(-40,40);this.vy=rndF(-60,-10);this.sz=sz||rnd(2,5);this.g=80;}
    upd(dt){this.life-=dt;this.vy+=this.g*dt;this.x+=this.vx*dt;this.y+=this.vy*dt;}
    get alive(){return this.life>0;}get al(){return Math.max(0,this.life/this.ml);}}
function spP(x,y,n,col,life,sz){for(let i=0;i<n;i++)PARTS.push(new Part(x,y,col,life,sz));}
class FTxt{constructor(x,y,txt,col){this.x=x;this.y=y;this.txt=txt;this.col=col||'#fff';this.life=1.2;this.ml=1.2;this.vy=-50;}
    upd(dt){this.life-=dt;this.y+=this.vy*dt;this.vy*=.98;}
    get alive(){return this.life>0;}get al(){return Math.max(0,Math.min(1,this.life/this.ml));}}
function spFT(x,y,t,c){FT.push(new FTxt(x,y,t,c));}

class Fireball{
    constructor(x,y,tx,ty){this.x=x;this.y=y;this.z=PL.z;const d=Math.hypot(tx-x,ty-y)||1;this.vx=((tx-x)/d)*295;this.vy=((ty-y)/d)*295;this.life=1.8;this.r=8;this.done=false;}
    upd(dt){if(this.done){this.life-=dt*3;return;}this.life-=dt;this.x+=this.vx*dt;this.y+=this.vy*dt;const t=w2t(this.x,this.y);if(!shotPassable(t.x,t.y,this.z)){this.explode();return;}for(const m of MON){if(m.alive&&m.z===this.z&&dst(this,m)<m.sz+this.r){this.explode();return;}}}
    explode(){if(this.done)return;this.done=true;this.life=.5;const sk=SKILL_DEFS.mage,base=(sk.damageBase+PL.lv*sk.damagePerLevel+PL.stats.INT*sk.damagePerInt)*(1+(sk.damagePerPoint||0)*(PL.talents[sk.damageTalent]||0)),radius=sk.radius||60;spP(this.x,this.y,28,'#ff6600',.6,5);spP(this.x,this.y,16,'#ffcc00',.4,3);for(const m of MON){if(!m.alive||m.z!==this.z)continue;const d=dst(this,m);if(d<radius){const dmg=Math.max(1,Math.floor(base*(1-d/(radius*2))));m.hit(dmg);healFromDamage(dmg,.45);if(sk.status)m.addSt(sk.status,sk.statusDamage||3,sk.statusDuration||3.5);if(!m.alive)onKill(m);}}}
    get alive(){return this.life>0;}get al(){return this.done?Math.max(0,this.life/.5):1;}
}

// ─── Shot (стрелы/магия) ──────────────────────────────────
class Shot{
    constructor(x,y,tgt,dmg,crit,type,fixA){
        this.x=x;this.y=y;this.z=PL.z;this.tgt=tgt;this.dmg=dmg;this.crit=crit;this.type=type;
        const spd=type==='magic'?305:470;
        const a=fixA!==undefined?fixA:(tgt?Math.atan2(tgt.y-y,tgt.x-x):0);
        this.vx=Math.cos(a)*spd;this.vy=Math.sin(a)*spd;this.angle=a;this.life=1.4;this.done=false;
        this.pierced=0;this.hitSet=new Set();
    }
    upd(dt){
        if(this.done){this.life-=dt*5;return;}
        this.life-=dt;
        if(this.tgt&&this.tgt.alive&&this.type!=='rain'){
            const ta=Math.atan2(this.tgt.y-this.y,this.tgt.x-this.x),spd=this.type==='magic'?305:470,h=.13;
            this.vx=this.vx*(1-h)+Math.cos(ta)*spd*h;this.vy=this.vy*(1-h)+Math.sin(ta)*spd*h;
        }
        this.angle=Math.atan2(this.vy,this.vx);this.x+=this.vx*dt;this.y+=this.vy*dt;
        const t=w2t(this.x,this.y);if(!shotPassable(t.x,t.y,this.z)){this.done=true;this.life=0;return;}
        for(const m of MON){
            if(!m.alive||m.z!==this.z||this.hitSet.has(m))continue;
            if(dst(this,m)<m.sz+6){
                this.hitSet.add(m);
                m.hit(this.dmg);
                if(this.crit)spFT(m.x,m.y-m.sz-10,'KRIT!','#ffff00');
                if(!m.alive)onKill(m);
                healFromDamage(this.dmg,this.type==='rain'?.65:1);
                if(this.type==='magic'){
                    spP(this.x,this.y,12,'#aa44ff',.4,3);
                    // Chain lightning
                    const chain=PL.talents.chainLightning||0;
                    if(chain>0){
                        let cnt=0;
                        for(const e of MON){
                            if(!e.alive||e.z!==this.z||e===m||this.hitSet.has(e))continue;
                            if(dst(this,e)<45+chain*15){e.hit(Math.floor(this.dmg*.5));this.hitSet.add(e);if(!e.alive)onKill(e);spP(e.x,e.y,6,'#8844ff',.3,2);cnt++;if(cnt>=chain)break;}
                        }
                    }
                } else spP(this.x,this.y,6,'#ffcc88',.3,2);
                // Pierce (łucznik)
                const pierceMax=this.type==='arrow'?(PL.talents.pierceShot||0):0;
                this.pierced++;
                if(this.pierced>pierceMax){this.done=true;this.life=0;return;}
                // Przebił — leć dalej prosto (brak homing na trafiony cel)
                this.tgt=null;
            }
        }
    }
    get alive(){return this.life>0;}
}

const ITEMS=[];
class GItem{constructor(x,y,type,amt,tk,z=PL.z){this.x=x;this.y=y;this.z=z;this.type=type;this.amt=amt||1;this.life=type==='corpse'?12:60;this.ml=this.life;this.bob=rndF(0,Math.PI*2);this.iname='';this.ibonus=0;this.tk=tk||null;}
    upd(dt){this.life-=dt;this.bob+=dt*2;}
    get alive(){return this.life>0;}get al(){return this.type==='corpse'?Math.max(.2,this.life/this.ml):1;}}
function spItem(x,y,type,amt,name,bonus,tk){
    if(type==='gold'){const ex=ITEMS.find(i=>i.z===PL.z&&i.type==='gold'&&dst(i,{x,y})<16&&i.alive);if(ex){ex.amt+=amt||1;ex.life=Math.max(ex.life,40);return;}}
    const it=new GItem(x,y,type,amt,tk,PL.z);it.iname=name||'';it.ibonus=bonus||0;ITEMS.push(it);
}

function classAtkStatBonus(){
    if(PL.classKey==='warrior')return PL.stats.STR*3.6+PL.stats.DEX*.8;

    if(PL.classKey==='mage')return PL.stats.INT*3.3+PL.stats.DEX*.5;

}
function effAtk(){const re=PL.equip.ring,bl=PL.blessTimer>0?1.2:1;return Math.floor((PL.baseAtk+PL.wbonus+classAtkStatBonus()+(re?re.atk:0))*bl);}
function effSpd(){return (PL.spd+PL.stats.AGI*6)*(PL.slowTimer>0?.65:1);}
function effAtkDelay(){return Math.max(.26,PL.atkSpd*(1-PL.stats.AGI*.022));}
function effCrit(){const re=PL.equip.ring,he=PL.equip.helmet,we=PL.equip.weapon;return Math.min(.7,PL.critChance+PL.stats.DEX*.03+(PL.classKey==='archer'?(PL.talents.critBoost||0)*.04:0)+(re?re.crit:0)+(he?he.crit:0)+(we?we.crit:0));}
function effDodge(){

    if(PL.classKey==='archer')d+=(PL.talents.archerDodge||0)*.05;
    return Math.min(.6,d);
}
function effDef(){const re=PL.equip.ring;return Math.floor(PL.abonus*.4+PL.hbonus*.3+(re?re.def:0)+PL.stats.VIT*.35+(PL.classKey==='mage'?(PL.talents.arcaneShield||0)*8:0));}
function effLifeSteal(){
    let ls=0;
    if(PL.classKey==='warrior')ls+=(PL.talents.lifeSteal||0)*.05+PL.stats.STR*.002;
    else if(PL.classKey==='archer')ls+=PL.stats.DEX*.0015;
    else if(PL.classKey==='mage')ls+=PL.stats.INT*.001;
    return Math.min(.25,ls);
}
function healFromDamage(dmg,ratio=1){
    const ls=effLifeSteal();if(ls<=0||dmg<=0)return 0;
    const hl=Math.max(1,Math.floor(dmg*ls*ratio));
    if(PL.hp<PL.mhp){PL.hp=Math.min(PL.mhp,PL.hp+hl);spFT(PL.x,PL.y-10,'+'+hl,'#00ff88');}
    return hl;
}

    if(PL.classKey==='mage')return `INT×3.3 + ZRE×0.5 = ${classAtkStatBonus().toFixed(1)}`;

}

function spendStat(st){

    if(st==='VIT'){PL.mhp+=20;PL.hp=Math.min(PL.hp+20,PL.mhp);}
    else if(st==='INT'){const old=PL.mmp;_applyEquip();PL.mp=Math.min(PL.mmp,PL.mp+(PL.mmp-old));}

function spendTalent(talentId){
    if(!PL.talentPts){msg('Brak punktów talentów!','#f88');return;}

function doRain(tx,ty){

}

function getShopItems(){

function handleNPCBtn(btn){
    const n=npcCurrent; if(!n)return;
    if(btn.action==='close'){npcOpen=false;npcCurrent=null;return;}
    if(n.type==='healer'){
        if(btn.action==='heal'){
            if(n.cd>0){msg('Poczekaj '+n.cd.toFixed(0)+'s.','#8df');return;}
            PL.hp=PL.mhp;PL.mp=PL.mmp;n.cd=20;n.dlgtxt='Bądź zdrów!';n.dlgt=2.5;
            spP(PL.x,PL.y,22,'#44ff88',.6,3);spFT(PL.x,PL.y-30,'ULECZONO!','#44ff88');
            msg('Uzdrowiciel: Pełne leczenie!','#8df');vib([20,10,20]);
        } else if(btn.action==='buy_hp'){
            if(PL.gold<15){msg('Za mało złota! (15g)','#f66');return;}
            PL.gold-=15;PL.hpot++;msg('Kupiono Miksturę HP ('+PL.hpot+')','#44ff88');
        } else if(btn.action==='buy_mp'){
            if(PL.gold<20){msg('Za mało złota! (20g)','#f66');return;}
            PL.gold-=20;PL.mpot++;msg('Kupiono Miksturę MP ('+PL.mpot+')','#4488ff');
        } else if(btn.action==='bless'){
            if(PL.gold<80){msg('Za mało złota! (80g)','#f66');return;}
            PL.gold-=80;PL.blessTimer=60;n.dlgtxt='Niech moc będzie z tobą!';n.dlgt=2;
            msg('✨ Błogosławieństwo! +20% ATK przez 60s','#ffdd44');
            spP(PL.x,PL.y,20,'#ffdd44',.6,4);spFT(PL.x,PL.y-30,'BŁOGOSŁAWIONY!','#ffdd44');
        }
    } else if(n.type==='merchant'){
        if(btn.action==='buy'){
            const it=btn.item;
            if(PL.gold<it.price){msg('Za mało złota!','#f66');return;}
            if(it.type==='hpot'){if(it.id==='caravan_hpot'&&!Courier.buyCaravanItem())return;PL.gold-=it.price;PL.hpot++;msg('Kupiono Miksturę HP','#88ff44');}
            else if(it.type==='mpot'){PL.gold-=it.price;PL.mpot++;msg('Kupiono Miksturę MP','#8888ff');}
            else if(it.type==='arrows'){
                if(PL.classKey!=='archer'){msg('Tylko dla Łucznika!','#f66');return;}
                PL.gold-=it.price;PL.arrows=Math.min(PL.maxArrows,PL.arrows+25);
                msg('Kupiono 25 strzał ('+PL.arrows+'/'+PL.maxArrows+')','#88ff44');
            } else if(it.type==='equip'){
                if(PL.inv.length>=MAX_INV){msg('Plecak pełny!','#f88');return;}
                const edb=EQUIP_DB[it.id];if(!edb)return;
                PL.gold-=it.price;
                PL.inv.push(Object.assign({id:it.id},edb));
                msg('Kupiono: '+it.name+' → plecak [C→Ekwip]','#aaffcc');
                spFT(PL.x,PL.y-30,it.name,'#aaffcc');
            }
            vib(10);
        } else if(btn.action==='scroll_up'){shopScroll=Math.max(0,shopScroll-1);}
        else if(btn.action==='scroll_down'){shopScroll++;}
    }
}

    const st=w2t(PL.x,PL.y);if(!walkable(st.x,st.y))return;
    const qx=new Int16Array(MW*MH),qy=new Int16Array(MW*MH);let h=0,t=0;

    while(h<t){const x=qx[h],y=qy[h++],nd=FLOW[y][x]+1;
        for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=MW||ny>=MH||FLOW[ny][nx]>=0||!walkable(nx,ny))continue;FLOW[ny][nx]=nd;qx[t]=nx;qy[t++]=ny;}

function flowVector(x,y){
    const t=w2t(x,y);if(!FLOW[t.y]||FLOW[t.y][t.x]<0)return null;

}

function drawJoystick(){
    if(!isMob)return;
    const hx=BTN_X0*.45,hy=UIT+viewH()-64;
    if(!joy.active){
        // Obszar joysticka — delikatny panel tła
        ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.arc(hx,hy,JR+10,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1.5;ctx.setLineDash([5,7]);
        ctx.beginPath();ctx.arc(hx,hy,JR,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
        // Krzyżyk kierunkowy
        ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(hx-JR*.7,hy);ctx.lineTo(hx+JR*.7,hy);ctx.stroke();
        ctx.beginPath();ctx.moveTo(hx,hy-JR*.7);ctx.lineTo(hx,hy+JR*.7);ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,.14)';ctx.font='22px serif';ctx.textAlign='center';
        ctx.fillText('🕹',hx,hy+7);ctx.textAlign='start';
        return;
    }
    // Aktywny joystick
    ctx.fillStyle='rgba(255,255,255,.06)';ctx.beginPath();ctx.arc(joy.bx,joy.by,JR,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,220,100,.3)';ctx.lineWidth=2.5;ctx.setLineDash([]);
    ctx.beginPath();ctx.arc(joy.bx,joy.by,JR,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(joy.bx,joy.by,JR*.5,0,Math.PI*2);ctx.stroke();
    if(Math.abs(joy.dx)>.05||Math.abs(joy.dy)>.05){
        ctx.strokeStyle='rgba(255,255,200,.4)';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(joy.bx,joy.by);ctx.lineTo(joy.kx,joy.ky);ctx.stroke();
    }
    // Knob joysticka
    const kR=JR*.42;
    const kg=ctx.createRadialGradient(joy.kx-kR*.3,joy.ky-kR*.3,1,joy.kx,joy.ky,kR);
    kg.addColorStop(0,'rgba(255,255,255,.7)');kg.addColorStop(1,'rgba(200,200,200,.45)');
    ctx.fillStyle=kg;ctx.beginPath();ctx.arc(joy.kx,joy.ky,kR,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='rgba(255,255,200,.75)';ctx.beginPath();ctx.arc(joy.kx,joy.ky,kR*.38,0,Math.PI*2);ctx.fill();
}

            ctx.fillStyle='rgba(60,55,45,.95)';
        } else {
            ctx.fillStyle=isMob?'rgba(12,10,6,.82)':'rgba(18,15,10,.78)';
        }
        ctx.fillRect(btn.x,btn.y,btn.w,btn.h);
        // ── Obramowanie ──
        let bc;
        if(autoActive)bc='rgba(0,255,140,'+(0.6+Math.sin(t*3)*.3)+')';
        else if(pr)bc='rgba(255,210,80,.95)';
        else if(btn.id==='c'&&PL.skillPts>0)bc='rgba(255,255,60,'+(Math.sin(t*4)*.3+.5)+')';
        else bc=isMob?'rgba(180,140,60,.45)':'rgba(180,140,60,.5)';
        ctx.strokeStyle=bc;ctx.lineWidth=pr||autoActive?2.5:1.5;ctx.strokeRect(btn.x,btn.y,btn.w,btn.h);
        // ── Efekt naciśnięcia ──
        if(pr){ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(btn.x,btn.y,btn.w,btn.h);}
        // ── Ikona ──
        const fSize=isMob?'28px':'24px';
        ctx.font=fSize+' serif';ctx.textAlign='center';
        ctx.fillText(btn.icon,btn.x+btn.w/2,btn.y+btn.h*(isMob?.56:.58));
        // ── Sub-etykieta ──
        let sub=btn.id.toUpperCase();
        if(btn.id==='f')sub=PL.hpot+'x';
        else if(btn.id==='g')sub=PL.mpot+'x';
        else if(btn.id==='q'&&PL.classKey==='archer')sub=PL.arrows+'↑';
        else if(btn.id==='auto')sub=autoTarget?'ON':'OFF';
        ctx.fillStyle=autoActive?'#44ffcc':'rgba(255,210,100,.85)';
        ctx.font='bold '+(isMob?'10':'9')+'px "Courier New"';
        ctx.fillText(sub,btn.x+btn.w/2,btn.y+btn.h*(isMob?.82:.72));
        // ── Pasek skrótu klawiaturowego (desktop) ──
        if(!isMob){
            const kmap={atk:'SPC',q:'Q',f:'F/H',g:'G',auto:'T',c:'C',settings:'O'};
            const kt=kmap[btn.id];
            if(kt){ctx.fillStyle='rgba(150,120,60,.6)';ctx.font='7px "Courier New"';
                ctx.fillText(kt,btn.x+btn.w/2,btn.y+btn.h-.12*btn.h);}
        }
        // ── Cooldown overlay ──
        let cd=0;if(btn.id==='f')cd=PL.pcd;else if(btn.id==='q')cd=PL.scd;
        if(cd>.1){
            ctx.fillStyle='rgba(0,0,0,.62)';ctx.fillRect(btn.x,btn.y,btn.w,btn.h);
            ctx.fillStyle='#fff';ctx.font='bold '+(isMob?'16':'14')+'px "Courier New"';
            ctx.fillText(cd.toFixed(1),btn.x+btn.w/2,btn.y+btn.h/2+5);
        }
        ctx.textAlign='start';
    }
}

function changeFloor(link){
    if(!link)return;PL.z=link.toZ;setActiveFloor(PL.z);const p=t2w(link.toX,link.toY);PL.x=p.x;PL.y=p.y;PL.floorGateKey=PL.z+':'+link.toX+':'+link.toY;PL.tgt=null;moveTarget=null;autoTarget=false;
    PROJ.length=0;SHOTS.length=0;ENEMY_SHOTS.length=0;HAZARDS.length=0;PARTS.length=0;FT.length=0;SLASH=null;rebuildFlow();updCam();
    msg((link.kind==='up'?'⬆ ':'⬇ ')+link.label+' → '+floorTitle(PL.z),'#ffe08a');spFT(PL.x,PL.y-28,floorTitle(PL.z),'#ffe08a');screenShake=3;vib([25,15,25]);
}
function checkFloorTransition(){const t=w2t(PL.x,PL.y),key=PL.z+':'+t.x+':'+t.y,link=linkAt(PL.z,t.x,t.y);if(!link){PL.floorGateKey='';return;}if(PL.floorGateKey===key)return;changeFloor(link);}

let respawnT=0,lastT=performance.now();
function update(dt){
    if(gameState!=='play'||paused)return;
    const d=Math.min(dt,.2);
    PL.time+=d;PL.regen+=d;
    if(PL.regen>=3){PL.regen=0;if(PL.hp<PL.mhp)PL.hp=Math.min(PL.mhp,PL.hp+Math.max(1,Math.floor(PL.mhp*.01)));if(PL.mp<PL.mmp)PL.mp=Math.min(PL.mmp,PL.mp+Math.max(1,Math.floor(PL.mmp*.025)));}
    if(PL.pcd>0)PL.pcd-=d;if(PL.scd>0)PL.scd-=d;if(PL.blessTimer>0)PL.blessTimer-=d;if(PL.slowTimer>0)PL.slowTimer-=d;if(screenShake>0)screenShake=Math.max(0,screenShake-24*d);
    for(const n of NPCS){if(n.cd>0)n.cd-=d;if(n.dlgt>0)n.dlgt-=d;}
    if(SLASH&&SLASH.life>0)SLASH.life-=d;
    if(pressT>0)pressT-=d;else pressedBtn=null;
    // Strzały łucznika
    if(PL.classKey==='archer'&&PL.arrows<PL.maxArrows){const rr=1.2-0.2*(PL.talents.arrowRegen||0);PL.arrowRegen+=d;if(PL.arrowRegen>=Math.max(.3,rr)){PL.arrowRegen=0;PL.arrows++;}}
    for(const r of RIPPLES){r.life-=d;r.r+=88*d;}for(let i=RIPPLES.length-1;i>=0;i--)if(RIPPLES[i].life<=0)RIPPLES.splice(i,1);

    updateFlow(d);
    PL.zoneTimer-=d;if(PL.zoneTimer<=0){PL.zoneTimer=.5;const t=w2t(PL.x,PL.y),z=zoneAt(t.x,t.y);if(z!==PL.zone){PL.zone=z;msg('🗺 '+z+' · '+floorTitle(PL.z),'#88ddff');spFT(PL.x,PL.y-36,z,'#88ddff');}}
    // ── Ruch gracza ──
    let mx=isMob?joy.dx:0, my=isMob?joy.dy:0;
    let keyMoved=false;
    if(KEYS['w']||KEYS['arrowup']){my-=1;keyMoved=true;}
    if(KEYS['s']||KEYS['arrowdown']){my+=1;keyMoved=true;}
    if(KEYS['a']||KEYS['arrowleft']){mx-=1;keyMoved=true;}
    if(KEYS['d']||KEYS['arrowright']){mx+=1;keyMoved=true;}
    if(keyMoved&&moveTarget)moveTarget=null;
    // Click-to-move (desktop)
    if(!isMob&&moveTarget&&!keyMoved&&mx===0&&my===0){
        const ddx=moveTarget.x-PL.x,ddy=moveTarget.y-PL.y,dist=Math.hypot(ddx,ddy);
        if(dist<TILE*.35)moveTarget=null;else{mx=ddx/dist;my=ddy/dist;}
    }
    const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
    PL.moving=!!(mx||my);
    if(PL.moving){if(Math.abs(mx)>=Math.abs(my))PL.dir=mx>0?'e':'w';else PL.dir=my>0?'s':'n';}
    const spd=effSpd()*(Courier.carrying?.78:1),nx=PL.x+mx*spd*d,ny=PL.y+my*spd*d,hw=PL.w/2;
    function ok(wx,wy){return walkable(w2t(wx,wy).x,w2t(wx,wy).y);}
    if(ok(nx-hw,PL.y)&&ok(nx+hw,PL.y)&&ok(nx-hw,PL.y+PL.h/2-2)&&ok(nx+hw,PL.y+PL.h/2-2))PL.x=nx;
    if(ok(PL.x-hw,ny)&&ok(PL.x+hw,ny)&&ok(PL.x-hw,ny+PL.h/2-2)&&ok(PL.x+hw,ny+PL.h/2-2))PL.y=ny;
    PL.x=clp(PL.x,TILE/2,MPW-TILE/2);PL.y=clp(PL.y,TILE/2,MPH-TILE/2);checkFloorTransition();

    if(PL.atkCd>0)PL.atkCd-=d;if(PL.iTimer>0)PL.iTimer-=d;
    PL.autoScan-=d;if(autoTarget&&(!PL.tgt||!PL.tgt.alive)&&PL.autoScan<=0){PL.autoScan=.3;PL.tgt=findBestTarget(TILE*9);}
    if(PL.atkCd<=0){const aa=getAutoAttackTarget();if(aa){if(aa!==PL.tgt&&autoTarget)PL.tgt=aa;doAtk(aa);}}
    for(const m of MON)if(m.alive&&m.z===PL.z)m.upd(d,PL);
    Courier.update(d);Outpost.update(d);
    for(let i=MON.length-1;i>=0;i--)if(!MON[i].alive&&MON[i].flash<=-2)MON.splice(i,1);
    for(const m of MON)if(!m.alive&&m.flash>-3)m.flash-=d;
    for(const p of PROJ)p.upd(d);for(let i=PROJ.length-1;i>=0;i--)if(!PROJ[i].alive)PROJ.splice(i,1);
    for(const s of SHOTS)s.upd(d);for(let i=SHOTS.length-1;i>=0;i--)if(!SHOTS[i].alive)SHOTS.splice(i,1);
    for(const s of ENEMY_SHOTS)s.upd(d);for(let i=ENEMY_SHOTS.length-1;i>=0;i--)if(!ENEMY_SHOTS[i].alive)ENEMY_SHOTS.splice(i,1);
    for(const h of HAZARDS)h.upd(d);for(let i=HAZARDS.length-1;i>=0;i--)if(!HAZARDS[i].alive)HAZARDS.splice(i,1);
    for(const it of ITEMS)it.upd(d);
    for(let i=ITEMS.length-1;i>=0;i--){
        const it=ITEMS[i];if(!it.alive||it.z!==PL.z)continue;const dd=dst(PL,it);
        if(it.type==='gold'&&dd<28){PL.gold+=it.amt;msg('+'+it.amt+'g ('+PL.gold+'g)','#ffe880');spP(it.x,it.y,8,'#ffcc00',.4,2);ITEMS.splice(i,1);}
        else if(it.type==='hpot'&&dd<24){PL.hpot++;msg('+Mikst.HP ('+PL.hpot+')','#f88');ITEMS.splice(i,1);}
        else if(it.type==='mpot'&&dd<24){PL.mpot++;msg('+Mikst.MP ('+PL.mpot+')','#88f');ITEMS.splice(i,1);}
        else if(it.type==='weapon'&&dd<24){
            if(PL.inv.length<MAX_INV){
                const _di={id:'drop_w_'+rnd(0,9999),name:it.iname,slot:'weapon',atk:it.ibonus,def:0,mp:0,crit:0,cost:0,req:1,col:'#88aaff',cls:''};
                PL.inv.push(_di);msg('📦 '+it.iname+' → plecak [C→Ekwip]','#8af');spP(it.x,it.y,8,'#88aaff',.4,2);
            }else msg('Plecak pełny! ('+it.iname+')','#f88');
            ITEMS.splice(i,1);}
        else if(it.type==='armor'&&dd<24){
            if(PL.inv.length<MAX_INV){
                const _di={id:'drop_a_'+rnd(0,9999),name:it.iname,slot:'armor',atk:0,def:it.ibonus,mp:0,crit:0,cost:0,req:1,col:'#88ffaa',cls:''};
                PL.inv.push(_di);msg('📦 '+it.iname+' → plecak [C→Ekwip]','#8fa');spP(it.x,it.y,8,'#88ffaa',.4,2);
            }else msg('Plecak pełny! ('+it.iname+')','#f88');
            ITEMS.splice(i,1);}
    }
    for(let i=ITEMS.length-1;i>=0;i--)if(!ITEMS[i].alive&&ITEMS[i].life<-5)ITEMS.splice(i,1);
    for(const p of PARTS)p.upd(d);for(let i=PARTS.length-1;i>=0;i--)if(!PARTS[i].alive)PARTS.splice(i,1);
    for(const ft of FT)ft.upd(d);for(let i=FT.length-1;i>=0;i--)if(!FT[i].alive)FT.splice(i,1);
    respawnT+=d;if(respawnT>20){respawnT=0;respawn();}
    if(PL.time-lastSaveT>20)saveGame(true);
    updCam();
}

    else if(id==='f')useHP();

C.addEventListener('pointerdown',e=>{
    _PTRS.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(_PTRS.size>=2){
        const pts=[..._PTRS.values()];
        _pinchDist0=Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y)||1;
        _pinchZoom0=zoom;
        if(joy.active){joy.active=false;joy.pid=null;joy.dx=0;joy.dy=0;}
        return;
    }
//-- oryginalne pointerdown --
    e.preventDefault();
    const{cx,cy}=cxy(e);
    if(gameState==='select'){if(hasSave()&&cx>=CW/2-120&&cx<=CW/2+120&&cy>=CH-46&&cy<=CH-14){loadGame();return;}for(const ck of CKEYS){const r=CRECTS[ck];if(cx>=r.x&&cx<r.x+r.w&&cy>=r.y&&cy<r.y+r.h){startGame(ck);return;}}return;}
    if(mapOpen){for(const b of MAP_BTNS){if(cx>=b.x&&cx<b.x+b.w&&cy>=b.y&&cy<b.y+b.h){if(b.id==='close')mapOpen=false;else if(b.id==='floor')mapViewZ=b.z;return;}}if(!inRect(cx,cy,mapWindowRect()))mapOpen=false;return;}
    if(settingsOpen){
        for(const b of SETTINGS_BTNS){if(cx>=b.x&&cx<b.x+b.w&&cy>=b.y&&cy<b.y+b.h){handleSettingsBtn(b);return;}}
        if(!inRect(cx,cy,settingsWindowRect()))settingsOpen=false;
        return;
    }
    if(npcOpen){
        for(const b of NPC_BTNS){if(cx>=b.x&&cx<b.x+b.w&&cy>=b.y&&cy<b.y+b.h){handleNPCBtn(b);return;}}
        if(!inRect(cx,cy,npcWindowRect())){npcOpen=false;npcCurrent=null;}
        return;
    }
    if(charOpen){
        for(const tb of TAB_BTNS){if(cx>=tb.x&&cx<tb.x+tb.w&&cy>=tb.y&&cy<tb.y+tb.h){charTab=tb.i;return;}}
        for(const sb of STAT_BTNS){if(cx>=sb.x&&cx<sb.x+sb.w&&cy>=sb.y&&cy<sb.y+sb.h){spendStat(sb.k);return;}}
        for(const tb of TALENT_BTNS){if(cx>=tb.x&&cx<tb.x+tb.w&&cy>=tb.y&&cy<tb.y+tb.h){spendTalent(tb.id);return;}}
        for(const sb of EQUIP_SLOT_BTNS){if(cx>=sb.x&&cx<sb.x+sb.w&&cy>=sb.y&&cy<sb.y+sb.h){unequipItem(sb.slot);return;}}
        for(const ib of INV_BTNS){if(cx>=ib.x&&cx<ib.x+ib.w&&cy>=ib.y&&cy<ib.y+ib.h){equipItem(ib.idx);return;}}
        if(!inRect(cx,cy,charWindowRect()))charOpen=false;
        return;
    }
    if(SETTINGS.showMinimap&&!SETTINGS.hideBottomPanel&&!adventureView){const cy0=UIT+GH,mmX=CW-115,mmY=cy0+10;if(cx>=mmX-2&&cx<=mmX+109&&cy>=mmY-2&&cy<=mmY+84){mapOpen=true;mapViewZ=PL.z;return;}}
    // Przyciski akcji
    if(cy>=UIT&&cy<bottomY()){
        for(const btn of (adventureView&&!isMob?[]:ABTNS)){if(cx>=btn.x&&cx<btn.x+btn.w&&cy>=btn.y&&cy<btn.y+btn.h){pressedBtn=btn.id;pressT=.25;ripple(cx,cy);handleBtn(btn.id);return;}}
    }
    // Joystick: TYLKO na isMob, lewa strona gry
    if(isMob&&!joy.active&&cy>=UIT&&cy<bottomY()&&cx<BTN_X0-8){
        joy.active=true;joy.pid=e.pointerId;joy.bx=cx;joy.by=cy;joy.kx=cx;joy.ky=cy;joy.dx=0;joy.dy=0;C.setPointerCapture(e.pointerId);return;
    }
    // Desktop: klik na świat gry = cel lub ruch
    if(!isMob&&cy>=UIT&&cy<bottomY()){
        const{wx,wy}=toWorld(cx,cy);
        const hitR=12;let hit=null;
        for(const m of MON){if(m.alive&&m.z===PL.z&&dst({x:wx,y:wy},m)<m.sz+hitR){hit=m;break;}}
        if(hit){PL.tgt=hit;msg('Celujesz: '+hit.name+' ['+hit.hp+'/'+hit.mhp+']','#ffcc88');vib(12);}
        else{moveTarget={x:wx,y:wy};PL.tgt=null;if(SETTINGS.dragMove&&e.button===0){dragMoveActive=true;C.setPointerCapture(e.pointerId);}} // click/drag-to-move
        ripple(cx,cy);return;
    }
    // Mobile: tap na wrogów
    if(isMob&&cy>=UIT&&cy<bottomY()){
        const{wx,wy}=toWorld(cx,cy);let hit=null;
        for(const m of MON){if(m.alive&&m.z===PL.z&&dst({x:wx,y:wy},m)<m.sz+22){hit=m;break;}}
        if(hit){PL.tgt=hit;msg('Celujesz: '+hit.name+' ['+hit.hp+'/'+hit.mhp+']','#ffcc88');vib(12);}else PL.tgt=null;
        ripple(cx,cy);
    }
},{passive:false});

    if(_PTRS.has(e.pointerId))_PTRS.set(e.pointerId,{x:e.clientX,y:e.clientY});

        zoom=clp(_pinchZoom0*(dist/_pinchDist0),ZOOM_MIN,ZOOM_MAX);
        updCam();return;
    }
//__
    e.preventDefault();const{cx,cy}=cxy(e);
    {const{wx:_wx,wy:_wy}=toWorld(cx,cy);mwx=_wx;mwy=_wy;}
    if(gameState==='select'){hovCard=null;for(const ck of CKEYS){const r=CRECTS[ck];if(cx>=r.x&&cx<r.x+r.w&&cy>=r.y&&cy<r.y+r.h){hovCard=ck;break;}}return;}

},{passive:false});

C.addEventListener('contextmenu',e=>{e.preventDefault();if(gameState==='play'&&!charOpen){PL.tgt=null;moveTarget=null;msg('Odcełowujesz.','#aaa');}});

addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();KEYS[k]=true;KEYS[e.code]=true;
    if(k==='v'&&gameState==='play'&&!e.ctrlKey&&!e.altKey&&!e.repeat&&!StudioLite.open){e.preventDefault();toggleAdventureView();return;}
    // F11 lub ` (backtick) = fullscreen — bez kolizji z grą
    if(e.key==='F11'||k==='`'){e.preventDefault();toggleFS();return;}
    if(e.key==='F8'){e.preventDefault();downloadMapPackage();return;}
    if(gameState==='select'){
        if(k==='1')startGame('warrior');else if(k==='2')startGame('archer');else if(k==='3')startGame('mage');else if(k==='l')loadGame();
        return;
    }
    if(k==='m'){e.preventDefault();mapOpen=!mapOpen;mapViewZ=PL.z;return;}
    if(k==='p'){e.preventDefault();paused=!paused;msg(paused?'⏸ Pauza':'▶ Gra wznowiona','#88ddff');return;}
    if(k==='k'){e.preventDefault();saveGame(false);return;}

render=function(){
    const time=performance.now()/1000;ctx.clearRect(0,0,CW,CH);if(gameState==='select'){drawSelectScreen();return;}
    ctx.save();ctx.beginPath();ctx.rect(0,UIT,GW,viewH());ctx.clip();if(screenShake>0)ctx.translate(rndF(-screenShake,screenShake),rndF(-screenShake,screenShake));
    {const vh=viewH(),zcx=GW/2,zcy=vh/2;ctx.translate(0,UIT);ctx.translate(zcx,zcy);ctx.scale(zoom,zoom);ctx.translate(-zcx,-zcy);}
    drawWorld();
    for(const h of HAZARDS)drawHazard(h);

    for(const it of ITEMS){if(it.z!==PL.z)continue;if(!it.alive&&it.type==='corpse'&&it.life<-3)continue;const x=it.x-CAM.x,y=it.y-CAM.y;if(x<-90||y<-90||x>cbW||y>cbH)continue;drawables.push({y:it.y+2,type:'item',obj:it,x,y});}
    for(const n of NPCS){if(n.z!==PL.z)continue;const x=n.x-CAM.x,y=n.y-CAM.y;if(x<-90||y<-90||x>cbW||y>cbH)continue;drawables.push({y:n.y,type:'npc',obj:n,x,y});}

    for(const d of drawables){

        else if(d.type==='monster'){drawMon(d.x,d.y,d.obj);if(PL.tgt===d.obj||d.obj.hp<d.obj.mhp)bars.push([d.obj,d.x,d.y]);}

    }

    ctx.save();ctx.beginPath();ctx.rect(0,UIT,GW,viewH());ctx.clip();drawMoveTarget();if(adventureView)drawAdventureStatus();else{drawQuestTracker();Courier.drawHUD();Outpost.drawHUD();}drawBossBar();drawJoystick();if(!adventureView||isMob)drawActionBtns();ctx.restore();drawUI();if(charOpen)drawCharScreen();drawNPCWindow();drawSettingsWindow();drawMapWindow();drawPause();
    if(assetPanelOpen){ctx.fillStyle='rgba(112,63,145,.2)';ctx.fillRect(0,0,CW,CH);}
    if(isMob&&window.innerHeight>window.innerWidth){ctx.fillStyle='rgba(0,0,0,.86)';ctx.fillRect(0,0,CW,CH);ctx.font='52px serif';ctx.textAlign='center';ctx.fillText('↻',CW/2,CH/2-16);ctx.fillStyle='#ffdd88';ctx.font='18px "Courier New"';ctx.fillText('Obróć urządzenie poziomo',CW/2,CH/2+24);ctx.textAlign='start';}
};

// ═══════════════════════════════════════════════════════════════════════════════
const COMBAT_ANIMATION_VERSION='13.0.0';
const PLAYER_ACTION_DURATIONS={
    warrior_attack:.34,archer_attack:.42,mage_attack:.50,
    warrior_whirlwind:.76,archer_arrow_rain:.88,mage_fireball:.82
};
let PLAYER_ACTION=null;
const COMBAT_FX=[];
let PLAYER_STEP_CLOCK=0;

function animClamp01(v){return Math.max(0,Math.min(1,v));}
function animSmooth(v){v=animClamp01(v);return v*v*(3-2*v);}
function animOut(v){v=animClamp01(v);return 1-Math.pow(1-v,3);}
function animPulse(v){return Math.sin(animClamp01(v)*Math.PI);}
function dirAngle(dir){return dir==='e'?0:dir==='s'?Math.PI*.5:dir==='w'?Math.PI:Math.PI*1.5;}
function angleDir(a){const x=Math.cos(a),y=Math.sin(a);return Math.abs(x)>=Math.abs(y)?(x>=0?'e':'w'):(y>=0?'s':'n');}
function beginPlayerAction(kind,angle,data={}){
    const duration=data.duration||PLAYER_ACTION_DURATIONS[kind]||.45;
    const a=Number.isFinite(angle)?angle:dirAngle(PL.dir);
    PLAYER_ACTION={kind,angle:a,duration,life:duration,data,startX:PL.x,startY:PL.y,impactDone:false};
    PL.dir=angleDir(a);
    return PLAYER_ACTION;
}
function getPlayerAction(p=PL){
    if(p!==PL||!PLAYER_ACTION||PLAYER_ACTION.life<=0)return null;
    const progress=animClamp01(1-PLAYER_ACTION.life/PLAYER_ACTION.duration);
    return Object.assign({progress},PLAYER_ACTION);
}
function pushCombatFX(kind,x,y,life=.45,data={}){
    const fx={kind,x,y,z:PL.z,life,ml:life,data,seed:Math.random()*10000};
    if(kind==='arrow_rain'){
        fx.arrows=Array.from({length:14},(_,i)=>({
            ox:rndF(-46,46),delay:i*.035+rndF(0,.16),tilt:rndF(-.12,.12),len:rndF(18,29)
        }));
    }
    COMBAT_FX.push(fx);return fx;
}
function updateCombatVisuals(dt){
    const d=Math.min(dt,.2);
    if(PLAYER_ACTION){PLAYER_ACTION.life-=d;if(PLAYER_ACTION.life<=0)PLAYER_ACTION=null;}
    for(let i=COMBAT_FX.length-1;i>=0;i--){const f=COMBAT_FX[i];f.life-=d;if(f.life<=0||f.z!==PL.z)COMBAT_FX.splice(i,1);}
    if(PL.moving){
        PLAYER_STEP_CLOCK-=d;
        if(PLAYER_STEP_CLOCK<=0){
            PLAYER_STEP_CLOCK=PL.classKey==='archer'?.19:.24;
            const tt=tileAt(w2t(PL.x,PL.y).x,w2t(PL.x,PL.y).y,PL.z);
            if(tt===3){RIPPLES.push({x:PL.x+rndF(-4,4),y:PL.y+5,r:3,life:.35,ml:.35,world:true});}
            else pushCombatFX('footstep',PL.x+rndF(-3,3),PL.y+7,.30,{tile:tt,side:Math.floor(PL.time*8)%2});
        }
    }else PLAYER_STEP_CLOCK=0;
}

const updateV12Combat=update;
update=function(dt){
    updateV12Combat(dt);
    if(gameState==='play'&&!paused)updateCombatVisuals(dt);
};
const changeFloorV12Combat=changeFloor;
changeFloor=function(link){PLAYER_ACTION=null;COMBAT_FX.length=0;return changeFloorV12Combat(link);};

// Projectiles can wait for the matching release frame instead of leaving the hand instantly.
const shotUpdateV12Combat=Shot.prototype.upd;
Shot.prototype.upd=function(dt){if(this.visualDelay>0){this.visualDelay-=dt;return;}shotUpdateV12Combat.call(this,dt);};
const fireballUpdateV12Combat=Fireball.prototype.upd;
Fireball.prototype.upd=function(dt){if(this.visualDelay>0){this.visualDelay-=dt;return;}fireballUpdateV12Combat.call(this,dt);};
const fireballExplodeV12Combat=Fireball.prototype.explode;
Fireball.prototype.explode=function(){const wasDone=this.done;fireballExplodeV12Combat.call(this);if(!wasDone&&this.done)pushCombatFX('fire_impact',this.x,this.y,.62,{radius:60});};

// Preserve all game balance and damage logic, but attach a readable anticipation/release/recovery animation.
const doAtkV12Combat=doAtk;
doAtk=function(m){
    if(PL.atkCd>0||!m||!m.alive)return doAtkV12Combat(m);
    if(PL.atkType!=='melee'&&!hasLineOfSight(PL.x,PL.y,m.x,m.y))return doAtkV12Combat(m);
    if(PL.atkType==='bow'&&!PL.arrows)return doAtkV12Combat(m);
    const angle=Math.atan2(m.y-PL.y,m.x-PL.x),beforeShots=SHOTS.length;
    doAtkV12Combat(m);
    if(PL.atkType==='melee'){
        beginPlayerAction('warrior_attack',angle);
        pushCombatFX('melee_release',PL.x,PL.y,.36,{angle,range:TILE*1.45});
        screenShake=Math.max(screenShake,2.2);
    }else if(PL.atkType==='bow'){
        beginPlayerAction('archer_attack',angle);
        const s=SHOTS[beforeShots];if(s)s.visualDelay=.19;
        pushCombatFX('bow_release',PL.x,PL.y,.40,{angle});
        screenShake=Math.max(screenShake,.7);
    }else{
        beginPlayerAction('mage_attack',angle);
        const s=SHOTS[beforeShots];if(s)s.visualDelay=.22;
        pushCombatFX('arcane_cast',PL.x,PL.y,.48,{angle,small:true});
        screenShake=Math.max(screenShake,1.1);
    }
};
const doWhirlV12Combat=doWhirl;
doWhirl=function(){
    const sk=SKILL_DEFS.warrior;if(PL.mp<sk.cost||PL.scd>0)return doWhirlV12Combat();
    doWhirlV12Combat();
    beginPlayerAction('warrior_whirlwind',dirAngle(PL.dir));
    pushCombatFX('whirlwind',PL.x,PL.y,.82,{radius:TILE*(sk.rangeTiles||1.8)});
    screenShake=Math.max(screenShake,5);
};
const doRainV12Combat=doRain;
doRain=function(tx,ty){
    const sk=SKILL_DEFS.archer;if(PL.arrows<sk.cost||PL.scd>0)return doRainV12Combat(tx,ty);
    const angle=Math.atan2(ty-PL.y,tx-PL.x),before=SHOTS.length;
    doRainV12Combat(tx,ty);
    beginPlayerAction('archer_arrow_rain',angle,{tx,ty});
    for(let i=before;i<SHOTS.length;i++)SHOTS[i].visualDelay=.30+(i-before)*.045;
    pushCombatFX('arrow_rain',tx,ty,.95,{angle,radius:SKILL_DEFS.archer.radius||52});
    pushCombatFX('bow_skill_cast',PL.x,PL.y,.72,{angle});
    screenShake=Math.max(screenShake,2.1);
};
const doFBV12Combat=doFB;
doFB=function(tx,ty){
    const sk=SKILL_DEFS.mage;if(PL.mp<sk.cost||PL.scd>0)return doFBV12Combat(tx,ty);
    const angle=Math.atan2(ty-PL.y,tx-PL.x),before=PROJ.length;
    doFBV12Combat(tx,ty);
    beginPlayerAction('mage_fireball',angle,{tx,ty});
    const fb=PROJ[before];if(fb)fb.visualDelay=.34;
    pushCombatFX('fireball_cast',PL.x,PL.y,.80,{angle});
    screenShake=Math.max(screenShake,2.8);
};

// Add impact language to normal projectiles.
const shotUpdateV13Impact=Shot.prototype.upd;
Shot.prototype.upd=function(dt){
    const n=this.hitSet?.size||0,wasDone=this.done;
    shotUpdateV13Impact.call(this,dt);
    const nn=this.hitSet?.size||0;
    if(nn>n){
        if(this.type==='magic')pushCombatFX('arcane_impact',this.x,this.y,.38,{angle:this.angle});
        else pushCombatFX('arrow_impact',this.x,this.y,.30,{angle:this.angle,rain:this.type==='rain'});
    }else if(!wasDone&&this.done&&this.type==='magic')pushCombatFX('arcane_fizzle',this.x,this.y,.24,{angle:this.angle});
};

function drawSwordShape(g,angle,length=24,glow=0){
    g.save();g.rotate(angle);if(glow){g.shadowColor=glow;g.shadowBlur=8;}
    g.fillStyle='#84582d';g.fillRect(-4,-2,8,4);g.fillStyle='#d2a949';g.fillRect(1,-5,3,10);
    const gr=g.createLinearGradient(4,0,length,0);gr.addColorStop(0,'#aab0ba');gr.addColorStop(.55,'#edf4ff');gr.addColorStop(1,'#8e9aa8');g.fillStyle=gr;
    g.beginPath();g.moveTo(4,-2.5);g.lineTo(length-5,-2);g.lineTo(length,0);g.lineTo(length-5,2);g.lineTo(4,2.5);g.closePath();g.fill();
    g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=.8;g.beginPath();g.moveTo(7,-1);g.lineTo(length-5,-.5);g.stroke();g.restore();
}
function drawBowShape(g,angle,pull=0,arrowVisible=true,skill=false){
    g.save();g.rotate(angle);g.strokeStyle=skill?'#d8ef88':'#9a652f';g.lineWidth=2.4;g.beginPath();g.moveTo(1,-11);g.quadraticCurveTo(9,0,1,11);g.stroke();
    g.strokeStyle=skill?'rgba(230,255,175,.9)':'#eadfbd';g.lineWidth=1;g.beginPath();g.moveTo(1,-11);g.lineTo(-pull,0);g.lineTo(1,11);g.stroke();
    if(arrowVisible){g.strokeStyle=skill?'#e7ffad':'#82502a';g.lineWidth=1.6;g.beginPath();g.moveTo(-pull-5,0);g.lineTo(18,0);g.stroke();g.fillStyle=skill?'#f4ffd5':'#d9e1e8';g.beginPath();g.moveTo(21,0);g.lineTo(15,-3);g.lineTo(16,0);g.lineTo(15,3);g.closePath();g.fill();}
    g.restore();
}
function drawStaffShape(g,angle,orbColor='#b66cff',power=.4,fire=false){
    g.save();g.rotate(angle);g.strokeStyle='#8d633c';g.lineWidth=3;g.beginPath();g.moveTo(-8,0);g.lineTo(18,0);g.stroke();g.strokeStyle='#d7b66f';g.lineWidth=1;g.beginPath();g.moveTo(-6,-1);g.lineTo(17,-1);g.stroke();
    const rr=4+power*7,gr=g.createRadialGradient(20,0,0,20,0,rr);gr.addColorStop(0,'rgba(255,255,235,1)');gr.addColorStop(.26,orbColor);gr.addColorStop(1,fire?'rgba(255,60,0,0)':'rgba(85,15,190,0)');g.fillStyle=gr;g.beginPath();g.arc(20,0,rr,0,Math.PI*2);g.fill();g.restore();
}
function drawShieldShape(g,x,y,scale=1){
    g.save();g.translate(x,y);g.scale(scale,scale);g.fillStyle='#5967a0';g.beginPath();g.moveTo(-6,-8);g.lineTo(7,-6);g.lineTo(6,4);g.lineTo(0,9);g.lineTo(-6,4);g.closePath();g.fill();g.strokeStyle='#aeb9dd';g.lineWidth=1.2;g.stroke();g.fillStyle='#d1aa4e';g.fillRect(-1,-6,2,12);g.fillRect(-5,-1,10,2);g.restore();
}

// Fully class-specific procedural player animation. External atlases still take priority.
drawPlayerArt=function(g,p,x,y,time,opts={}){
    const cls=opts.classKey||p.classKey||'warrior',action=p===PL?getPlayerAction(p):null;
    const dir=opts.dir||p.dir||'s',moving=opts.moving??p.moving;
    const state=action?(action.kind.includes('whirlwind')||action.kind.includes('rain')||action.kind.includes('fireball')?'skill':'attack'):(moving?'walk':'idle');
    const frame=action?Math.min(3,Math.floor(action.progress*4)):(opts.frame??actorFrame(time,moving));
    if(drawExternalAsset('player.'+cls,g,x-24,y-54,48,56,state,frame,action?angleDir(action.angle):dir,1))return;

    const phase=(frame/4)*Math.PI*2,idleBreath=Math.sin(time*2.1)*.45,walkBob=moving?Math.sin(phase)*1.35:idleBreath;
    const a=action?.progress||0,kind=action?.kind||'',aim=action?.angle??dirAngle(dir);
    let rootRot=0,lunge=0,crouch=0,recoil=0,torsoLean=0;
    if(kind==='warrior_attack'){
        const wind=animSmooth(a/.26),strike=animOut((a-.26)/.35),recover=animSmooth((a-.61)/.39);
        lunge=animPulse((a-.18)/.68)*6;torsoLean=-.10*wind+.18*strike-.12*recover;recoil=animPulse((a-.56)/.44)*1.5;
    }else if(kind==='warrior_whirlwind'){
        rootRot=animOut(a)*Math.PI*2.35;crouch=animPulse(a)*2.6;lunge=animPulse(a)*1.2;
    }else if(kind==='archer_attack'){
        crouch=animPulse(a)*1.3;recoil=animPulse((a-.48)/.52)*2.2;torsoLean=-.10*animPulse(a);
    }else if(kind==='archer_arrow_rain'){
        crouch=2.7*animPulse(a);torsoLean=-.18*animPulse(a);recoil=animPulse((a-.58)/.42)*2;
    }else if(kind==='mage_attack'){
        lunge=animPulse(a)*2.2;torsoLean=.10*animPulse(a);recoil=animPulse((a-.52)/.48)*1.2;
    }else if(kind==='mage_fireball'){
        crouch=1.8*animPulse(a);torsoLean=-.13*animPulse(a);recoil=animPulse((a-.58)/.42)*2.4;
    }
    const lx=Math.cos(aim)*lunge,ly=Math.sin(aim)*lunge-recoil;
    g.save();g.translate(Math.round(x),Math.round(y+walkBob));drawSoftShadow(g,0,7,11+Math.abs(lunge)*.25,5,.32);
    g.translate(lx,ly+crouch);g.rotate(rootRot+torsoLean);
    const side=dir==='e'?1:dir==='w'?-1:0,front=dir==='s',back=dir==='n',leg=Math.sin(phase)*3;
    const movingLeg=action?0:(moving?leg:0),stance=action?2.3*animPulse(a):0;
    g.fillStyle='#2d251f';g.fillRect(-7-stance*.3,0+movingLeg*.23,5,8-crouch*.16);g.fillRect(2+stance*.3,0-movingLeg*.23,5,8-crouch*.16);
    g.fillStyle='#151619';g.fillRect(-8-stance*.3,6+movingLeg*.23,7,3);g.fillRect(1+stance*.3,6-movingLeg*.23,7,3);
    const pal=cls==='warrior'?{main:'#b43d36',dark:'#6e201e',trim:'#d9ac4c',cloth:'#842b27'}:cls==='archer'?{main:'#4f7e3f',dark:'#294a2a',trim:'#c49c55',cloth:'#3b6536'}:{main:'#5750b5',dark:'#2f2973',trim:'#e0bd58',cloth:'#403990'};
    // cape / robe movement behind the torso
    g.fillStyle=pal.dark;g.beginPath();g.moveTo(-8,-12);g.lineTo(8,-12);g.lineTo(10+Math.sin(time*3)*1.2,5);g.lineTo(-10-Math.sin(time*3)*1.2,5);g.closePath();g.fill();
    if(cls==='mage'){g.fillStyle=pal.main;g.beginPath();g.moveTo(-8,-15);g.lineTo(8,-15);g.lineTo(12,6);g.lineTo(-12,6);g.closePath();g.fill();g.fillStyle='rgba(255,255,255,.12)';g.fillRect(-6,-13,3,14);}
    else{g.fillStyle=pal.main;g.fillRect(-8,-14,16,15);g.fillStyle='rgba(255,255,255,.12)';g.fillRect(-6,-12,3,9);g.fillStyle=pal.cloth;g.fillRect(-10,-12,3,10);g.fillRect(7,-12,3,10);}
    g.fillStyle=pal.trim;g.fillRect(-8,-3,16,3);g.fillRect(-2,-15,4,3);
    if(p.abonus>=4){g.strokeStyle=p.abonus>=8?'#adc3ff':'#a6a8b3';g.lineWidth=1;g.strokeRect(-7,-13,14,11);g.fillStyle=p.abonus>=8?'#6472c8':'#777b86';g.fillRect(-5,-10,10,2);}
    // shoulders and arms are animated independently per class
    const shoulderY=-9,skin='#dda773';
    g.fillStyle=skin;g.beginPath();g.arc(side*1,-20,7,0,Math.PI*2);g.fill();
    const blink=(time%4.6)>4.42;
    const hair=cls==='archer'?'#36552d':cls==='mage'?'#343266':'#5d626b';
    if(cls==='archer'){g.fillStyle=hair;g.beginPath();g.moveTo(-9,-20);g.lineTo(0,-30);g.lineTo(9,-20);g.lineTo(7,-16);g.lineTo(-7,-16);g.closePath();g.fill();}
    else if(cls==='mage'){g.fillStyle=hair;g.beginPath();g.arc(0,-21,9,Math.PI,Math.PI*2);g.lineTo(9,-16);g.lineTo(-9,-16);g.closePath();g.fill();g.fillStyle=pal.trim;g.fillRect(-7,-21,14,2);}
    else{g.fillStyle='#b9bec8';g.beginPath();g.arc(0,-21,8,Math.PI,Math.PI*2);g.lineTo(8,-17);g.lineTo(-8,-17);g.closePath();g.fill();g.fillStyle='#777d87';g.fillRect(-8,-20,16,3);g.fillStyle='#d7b14d';g.fillRect(-1,-28,2,8);}
    if(!back&&!blink){g.fillStyle='#241b17';if(side)g.fillRect(side>0?2:-4,-21,2,2);else{g.fillRect(-4,-21,2,2);g.fillRect(2,-21,2,2);}}
    if(front){g.fillStyle='#8c513d';g.fillRect(-2,-17,4,1);}

    const localAim=aim-rootRot-torsoLean;
    if(cls==='warrior'){
        let swordAngle=localAim+.12;
        if(kind==='warrior_attack'){
            const wind=animSmooth(a/.26),strike=animOut((a-.26)/.36),recover=animSmooth((a-.62)/.38);
            swordAngle=localAim-1.42*wind+1.95*strike-.58*recover;
        }else if(kind==='warrior_whirlwind')swordAngle=localAim+a*Math.PI*4.7;
        const handX=8+Math.cos(localAim)*2,handY=shoulderY+Math.sin(localAim)*2;
        g.strokeStyle='#8d6749';g.lineWidth=4;g.lineCap='round';g.beginPath();g.moveTo(6,shoulderY);g.lineTo(handX,handY);g.stroke();
        g.save();g.translate(handX,handY);drawSwordShape(g,swordAngle,kind==='warrior_whirlwind'?27:25,p.wbonus>=8?'#8ad9ff':0);g.restore();
        drawShieldShape(g,-11,shoulderY+1,kind==='warrior_whirlwind'?.88:1);
        if(kind==='warrior_whirlwind'){
            g.save();g.globalAlpha=.28;g.strokeStyle='#ffe083';g.lineWidth=3;for(let i=0;i<3;i++){g.beginPath();g.arc(0,-7,18+i*4,a*Math.PI*4+i, a*Math.PI*4+i+1.15);g.stroke();}g.restore();
        }
    }else if(cls==='archer'){
        const isRain=kind==='archer_arrow_rain';
        let pull=0,release=false;
        if(kind==='archer_attack'){pull=a<.50?10*animSmooth(a/.50):10*(1-animSmooth((a-.50)/.15));release=a>.58;}
        else if(isRain){pull=a<.58?12*animSmooth(a/.58):12*(1-animSmooth((a-.58)/.16));release=a>.68;}
        const bowAim=isRain?localAim-Math.PI*.18:localAim;
        const fx=Math.cos(bowAim)*9,fy=shoulderY+Math.sin(bowAim)*6;
        g.fillStyle='#694323';g.fillRect(-11,-15,4,16);for(let i=0;i<4;i++){g.strokeStyle='#e0cd96';g.beginPath();g.moveTo(-9,-15+i*3);g.lineTo(-12,-22+i);g.stroke();}
        g.strokeStyle=skin;g.lineWidth=3.5;g.lineCap='round';g.beginPath();g.moveTo(5,shoulderY);g.lineTo(fx,fy);g.stroke();g.beginPath();g.moveTo(-5,shoulderY);g.lineTo(-Math.cos(bowAim)*pull*.55,-8-Math.sin(bowAim)*pull*.25);g.stroke();
        g.save();g.translate(fx,fy);drawBowShape(g,bowAim,pull,!release,isRain);g.restore();
        if(isRain&&a>.18&&a<.72){g.save();g.globalCompositeOperation='lighter';for(let i=0;i<5;i++){const aa=-1.1+i*.55+time*.4,rr=13+i%2*3;g.strokeStyle='rgba(205,255,125,'+(animPulse(a)*.55)+')';g.lineWidth=1.2;g.beginPath();g.moveTo(Math.cos(aa)*rr,-24+Math.sin(aa)*5);g.lineTo(Math.cos(aa)*rr+8,-28+Math.sin(aa)*5);g.stroke();}g.restore();}
    }else{
        const fire=kind==='mage_fireball',charge=fire?animClamp01(a/.55):(kind==='mage_attack'?animClamp01(a/.46):.28+.12*Math.sin(time*4));
        let staffAim=localAim;
        if(fire)staffAim=localAim-.45*(1-animSmooth(a/.55));
        else if(kind==='mage_attack')staffAim=localAim-.35*(1-animSmooth(a/.46));
        const hx=8+Math.cos(staffAim)*2,hy=shoulderY+Math.sin(staffAim)*3;
        g.strokeStyle=skin;g.lineWidth=3.5;g.lineCap='round';g.beginPath();g.moveTo(5,shoulderY);g.lineTo(hx,hy);g.stroke();
        g.save();g.translate(hx,hy);drawStaffShape(g,staffAim,fire?'rgba(255,95,15,.98)':'rgba(178,95,255,.98)',charge,fire);g.restore();
        const freeX=-7+Math.cos(localAim)*charge*4,freeY=-8+Math.sin(localAim)*charge*3;g.strokeStyle=skin;g.beginPath();g.moveTo(-5,shoulderY);g.lineTo(freeX,freeY);g.stroke();
        if(kind==='mage_attack'||fire){
            g.save();g.globalCompositeOperation='lighter';const ox=Math.cos(localAim)*(fire?15:11),oy=-10+Math.sin(localAim)*(fire?9:6),rr=(fire?5:3)+charge*(fire?10:6);const gr=g.createRadialGradient(ox,oy,0,ox,oy,rr);gr.addColorStop(0,'rgba(255,255,235,.98)');gr.addColorStop(.28,fire?'rgba(255,150,35,.95)':'rgba(191,102,255,.9)');gr.addColorStop(1,fire?'rgba(255,25,0,0)':'rgba(90,15,210,0)');g.fillStyle=gr;g.beginPath();g.arc(ox,oy,rr,0,Math.PI*2);g.fill();
            if(fire){g.strokeStyle='rgba(255,190,70,'+(.25+charge*.55)+')';g.lineWidth=1.3;for(let i=0;i<3;i++){g.beginPath();g.arc(0,-6,12+i*5,time*(i%2?1:-1)+i, time*(i%2?1:-1)+i+2.2);g.stroke();}}
            g.restore();
        }
    }
    if(p.blessTimer>0){g.strokeStyle='rgba(255,225,100,'+(.35+Math.sin(time*6)*.2)+')';g.lineWidth=2;g.beginPath();g.ellipse(0,-7,15,24,0,0,Math.PI*2);g.stroke();}
    g.restore();
};

// Monster attacks now visibly anticipate and lunge instead of using a cooldown as an unused "state".
const drawMonsterArtV12Combat=drawMonsterArt;
drawMonsterArt=function(g,m,x,y,time,opts={}){
    const attacking=m.acd>Math.max(0,m.as-.30),p=attacking?animClamp01((m.acd-(m.as-.30))/.30):0;
    const ang=Math.atan2(PL.y-m.y,PL.x-m.x),lunge=attacking?animPulse(1-p)*4.5:0;

    drawMonsterArtV12Combat(g,m,x,y,time,Object.assign({},opts,{attackProgress:attacking?1-p:0}));

  }).filter(h=>h.dist<=radius+h.m.sz*.3&&Math.abs(h.delta)<=halfAngle&&hasLineOfSight(PL.x,PL.y,h.m.x,h.m.y,PL.z))
    .sort((a,b)=>a.dist-b.dist);
  SLASH={x:PL.x,y:PL.y,angle:facing,life:.22,ml:.22,range:radius,full:false};
  pushCombatFX('melee_release',PL.x,PL.y,.36,{angle:facing,range:radius});
  if(!hit.length){spatialSwingEvidence.misses++;return;}
  spatialSwingEvidence.contacts++;
  const base=effAtk();let damage=rnd(Math.floor(base*.85),Math.floor(base*1.15));
  const crit=Math.random()<effCrit();if(crit)damage=Math.floor(damage*2);
  let first=true;
  for(const h of hit){
    const dealt=first?damage:Math.max(1,Math.floor(damage*.6));
    h.m.hit(dealt);spatialSwingEvidence.damagingHits++;
    if(first){if(crit){h.m.addSt('bleed',2,2.5);spFT(h.m.x,h.m.y-h.m.sz-10,'KRIT!','#ffff00');}
      healFromDamage(dealt,1);first=false;}
  }
  screenShake=Math.max(screenShake,2.2);
}
atkNearest = function(){
  if(!spatialSwingMode || PL.classKey !== 'warrior')return priorSpatialAtkNearest();
  if(gameState !== 'play'||paused||StudioLite.open||charOpen||npcOpen||mapOpen||settingsOpen||PL.atkCd>0)return;
  const facing=dirAngle(PL.dir);
  PL.atkCd=effAtkDelay();spatialSwingEvidence.swings++;
  spatialPending={angle:facing,radius:PL.atkRange,z:PL.z,elapsed:0};
  beginPlayerAction('warrior_attack',facing);
};
// Soft *contact* is independent of input mode: solid-ish bodies should not occupy
// the same centre while we ask players to reason about facing. No dash, knockback
// animation lock, invulnerability or a new AI system. Legacy mode is untouched.
let spatialContactCorrections=0;
const priorSpatialUpdate=update;
update=function(dt){
  priorSpatialUpdate(dt);
  if(gameState!=='play'||paused)return;
  if(spatialPending){
    if(!spatialSwingMode||PL.classKey!=='warrior'||PL.hp<=0||PL.z!==spatialPending.z||charOpen||npcOpen||mapOpen||settingsOpen||StudioLite.open){spatialPending=null;spatialCanceled++;}
    else {spatialPending.elapsed+=Math.min(Math.max(dt,0),.2);
      if(spatialPending.elapsed>=SPATIAL_IMPACT_TIME){const impact=spatialPending;spatialPending=null;resolveSpatialSwing(impact);}
    }
  }
  if(PL.hp<=0)return; // Contact is a world rule, not a selected attack scheme.
  for(const m of MON){
    if(!m.alive||m.z!==PL.z)continue;
    const rad=PL.w*.48+m.sz*.70;
    let dx=m.x-PL.x,dy=m.y-PL.y,dist=Math.hypot(dx,dy);
    if(dist>=rad)continue;
    if(dist<.001){const a=dirAngle(PL.dir);dx=Math.cos(a);dy=Math.sin(a);dist=1;}
    const force=Math.min(rad-dist,240*Math.min(Math.max(dt,0),.2));
    const nx=m.x+dx/dist*force,ny=m.y+dy/dist*force;
    const rr=m.sz*.46;
    if([[nx-rr,ny-rr],[nx+rr,ny-rr],[nx-rr,ny+rr],[nx+rr,ny+rr]].every(([x,y])=>{
       const t=w2t(x,y);return walkable(t.x,t.y,PL.z);
    })){
      m.x=nx;m.y=ny;spatialContactCorrections++;
    }
  }
};
const priorSpatialStartGame=startGame;
startGame=function(...args){spatialPending=null;spatialCanceled=0;spatialSwingMode=false;spatialSwingEvidence.swings=0;spatialSwingEvidence.misses=0;spatialSwingEvidence.contacts=0;spatialSwingEvidence.damagingHits=0;spatialContactCorrections=0;return priorSpatialStartGame(...args);};
addEventListener('keydown',ev=>{
  if(ev.key.toLowerCase()!=='b'||ev.repeat||ev.ctrlKey||ev.altKey||ev.metaKey||gameState!=='play'||paused||StudioLite.open||charOpen||npcOpen||mapOpen||settingsOpen)return;
  if(PL.classKey!=='warrior')return;
  ev.preventDefault();spatialSwingMode=!spatialSwingMode;PL.tgt=null;
  if(!spatialSwingMode&&spatialPending){spatialPending=null;spatialCanceled++;}
  msg(spatialSwingMode?'⚔ Zamach: kierunek WASD, trafienie w fazie kontaktu':'⚔ Powrót do historycznej walki celowanej',spatialSwingMode?'#ffe8a0':'#a0c2ff');
});
const priorSpatialRender=render;
render=function(){
  priorSpatialRender();
  if(gameState!=='play'||PL.classKey!=='warrior'||StudioLite.open||mapOpen||charOpen||npcOpen||settingsOpen)return;
  ctx.save();ctx.textAlign='right';ctx.font='bold 10px "Courier New"';
  const caption=spatialSwingMode?'[B] ZAMACH · Spacja: przytrzymaj · [T] AUTO '+(autoTarget?'ON':'OFF'):'[B] Walka celowana · [T] auto-cel '+(autoTarget?'ON':'OFF');
  const width=Math.ceil(ctx.measureText(caption).width)+15;
  ctx.fillStyle='rgba(12,17,21,.80)';ctx.fillRect(GW-width-8,UIT+4,width+5,17);
  ctx.fillStyle=spatialSwingMode?'#ffe09b':'#d7d0b7';ctx.fillText(caption,GW-12,UIT+16);
  ctx.restore();
};

// Hybrid ergonomics: the same true geometry and impact time, without requiring
// a fresh key press for every identical strike. T reuses the game's existing AUTO.
// No monster gets hurt by the helper: it only initiates the same spatial swing.
let spatialAutomaticStarts=0,spatialHeldStarts=0;
const priorHybridHandleBtn=handleBtn;
handleBtn=function(id){
  if(id==='auto'&&spatialSwingMode&&PL.classKey==='warrior'){
    autoTarget=!autoTarget;vib(15);
    msg(autoTarget?'⚔ AUTO-B: ciosy w pobliskich wrogów · nadal liczysz się z kierunkiem':'⚔ AUTO-B wyłączone · przytrzymaj Spację',autoTarget?'#95ecb2':'#d9c49a');
    return;
  }
  return priorHybridHandleBtn(id);
};
// Legacy KEY state can remain set if the tab loses focus without receiving keyup.
addEventListener('blur',()=>{KEYS[' ']=false;KEYS['Space']=false;});
const priorHybridUpdate=update;
update=function(dt){
  priorHybridUpdate(dt);
  if(!spatialSwingMode||PL.classKey!=='warrior'||gameState!=='play'||paused||
     StudioLite.open||charOpen||npcOpen||mapOpen||settingsOpen||PL.hp<=0||
     spatialPending||PL.atkCd>0)return;
  // Holding Space repeats attacks at the normal weapon speed, including misses.
  // It does not override the facing chosen by WASD or click-to-move.
  if(KEYS[' ']||KEYS['Space']){
    atkNearest();spatialHeldStarts++;return;
  }
  if(!autoTarget)return;
  // AUTO searches ONLY immediate collision/weapon range, never chases monsters.
  // Current line-of-sight includes terrain AND the movable cart.
  let best=null,bestD=Infinity;
  const steering=!!PL.moving||!!moveTarget;
  for(const m of MON){
    if(!m.alive||m.z!==PL.z)continue;
    const dd=Math.hypot(m.x-PL.x,m.y-PL.y);
    if(dd>PL.atkRange+m.sz*.3||dd>=bestD||
       !hasLineOfSight(PL.x,PL.y,m.x,m.y,PL.z))continue;
    // When steering with WASD, only consider threats inside the current arc;
    // a closer rat behind us must not hide a valid one right in front.
    const angle=Math.atan2(m.y-PL.y,m.x-PL.x);
    const delta=Math.atan2(Math.sin(angle-dirAngle(PL.dir)),Math.cos(angle-dirAngle(PL.dir)));
    if(steering&&Math.abs(delta)>Math.PI*.36)continue;
    best=m;bestD=dd;
  }
  if(!best)return;
  if(!steering){
    PL.dir=angleDir(Math.atan2(best.y-PL.y,best.x-PL.x));
  }
  atkNearest();spatialAutomaticStarts++;

};
const priorHybridStartGame=startGame;
startGame=function(...args){spatialAutomaticStarts=0;spatialHeldStarts=0;return priorHybridStartGame(...args);};
window.CoopegeSpatialCombat=Object.freeze({
  get manual(){return spatialSwingMode&&PL.classKey==='warrior';},
  inspect:()=>({mode:spatialSwingMode?'spatial':'legacy',classKey:PL.classKey,
    facing:PL.dir,atkCd:PL.atkCd,player:{x:PL.x,y:PL.y,z:PL.z,hp:PL.hp,kills:PL.kills},
    swings:spatialSwingEvidence.swings,misses:spatialSwingEvidence.misses,
    contacts:spatialSwingEvidence.contacts,damagingHits:spatialSwingEvidence.damagingHits,contactCorrections:spatialContactCorrections,
    pending:spatialPending?{elapsed:spatialPending.elapsed,angle:spatialPending.angle}:null,canceled:spatialCanceled,impactTime:SPATIAL_IMPACT_TIME,
    held:!!(KEYS[' ']||KEYS['Space']),auto:!!autoTarget,automaticStarts:spatialAutomaticStarts,heldStarts:spatialHeldStarts,
    target:PL.tgt?.name??null})
});

lastT=performance.now();requestAnimationFrame(loop);
})();
</script>
