name: Coopege F1 - contact recovery against owner blocker
on:
  push:
    branches: ['experiment/coopege-f1-contact-recovery-2026-10-24']
    paths:
      - '.github/workflows/coopege-c1.yml'
      - 'research/coopege-c1/src/**'
      - 'research/coopege-c1/template.html'
      - 'research/coopege-c1/build.mjs'
      - 'research/coopege-c1/*.mjs'
      - 'research/coopege-e1/contact_deadlock.audit.mjs'
      - 'research/coopege-f1/**'
      - 'research/coopege-b0/**'
      - 'tools/browser/**'
permissions:
  contents: read
concurrency:
  group: coopege-f1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  playable:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true
      - name: Recover source facts from untouched original game
        env:
          COOPEGE_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: node research/coopege-b0/audit-boundary.mjs
      - name: Validate authored witness
        run: node research/coopege-b0/validate-witness.mjs
      - name: Ship exact authored data, ignoring only unstable extraction timestamp
        run: node --test research/coopege-c1/source-integrity.test.mjs
      - name: Build C1 from owned, separately editable source parts
        run: |
          node --check research/coopege-c1/src/core.js
          node --check research/coopege-c1/src/episode.js
          node --check research/coopege-c1/src/view.js
          node research/coopege-c1/build.mjs
      - name: Existing Owner contact blockade is now a required green gate
        run: node research/coopege-e1/contact_deadlock.audit.mjs --gate
      - name: Six-angle recovery, inward blocking and detour regression
        run: node --test research/coopege-f1/contact-recovery.test.mjs
      - name: Source-backed gameplay contracts
        run: node --test research/coopege-c1/episode.test.mjs
      - name: Full ordinary keyboard Chrome journey and persistent return
        env:
          COOPEGE_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: node research/coopege-c1/expedition.browser.mjs
      - name: Unassisted vulnerable worker — live Chrome through visible threat and consequence
        env:
          COOPEGE_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: node research/coopege-c1/worker.browser.mjs
      - name: Recover pinned A1 richer playable comparator (read-only)
        run: |
          git fetch --no-tags --depth=1 origin experiment/coopege-a1-tibia-donor-2026-10-23
          test "$(git rev-parse FETCH_HEAD)" = "c8bc9f1117e32f6db5940a565c905569e95692b9"
          git show FETCH_HEAD:experiments/coopege-a1/Coopege_A1_Tibia_Donor.html > .build/coopege-c1/A1_pinned.html
      - name: Compare ordinary playable A1 vs C1 journey under real Chrome
        env:
          COOPEGE_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: node research/coopege-c1/compare.browser.mjs
      - name: Test A1's actual live map authoring roundtrip and new quest boundary
        env:
          COOPEGE_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: node research/coopege-c1/donor-viability.browser.mjs
      - name: Archive standalone HTML, screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coopege-f1-contact-proof
          retention-days: 21
          if-no-files-found: warn
          path: |
            .build/coopege-c1/Coopege_C1_Expedition.html
            .build/coopege-c1/*.png
            .build/coopege-c1/*.json
            .build/coopege-b0/source-authored-witness.json
            research/coopege-c1/ACTIVE.md
            research/coopege-c1/PRODUCT_RESCUE_2026-10-24.md
