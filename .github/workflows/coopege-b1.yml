name: Coopege B1/B2/B3/B4 - authored world and contact gates
on:
  push:
    branches: ['experiment/coopege-b1-material-return-2026-10-23', 'experiment/coopege-b2-reliability-2026-10-23', 'experiment/coopege-b3-continuous-contact-2026-10-23', 'experiment/coopege-b4-visual-identity-2026-10-23']
permissions:
  contents: read
jobs:
  playable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser for live witness + real game
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true
      - name: Recover authored facts from real original Tibia API
        env:
          COOPEGE_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: node research/coopege-b0/audit-boundary.mjs
      - name: Verify historic authored meaning without old runtime
        run: node research/coopege-b0/validate-witness.mjs
      - name: Gameplay contracts (terrain, moving cover, combat and persistence)
        run: node --test research/coopege-b1/world.test.mjs research/coopege-b1/input.test.mjs
      - name: Build standalone new candidate from source facts
        run: node research/coopege-b1/build.mjs
      - name: Actual hosted Chromium, natural player input, save and load
        env:
          COOPEGE_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: node research/coopege-b1/browser.test.mjs
      - name: Fetch pinned rich RPG A1 comparator without merging its old engine
        run: |
          git fetch --no-tags --depth=1 origin experiment/coopege-a1-tibia-donor-2026-10-23
          test "$(git rev-parse FETCH_HEAD)" = "c8bc9f1117e32f6db5940a565c905569e95692b9"
          mkdir -p .build/coopege-b2
          git show FETCH_HEAD:experiments/coopege-a1/Coopege_A1_Tibia_Donor.html > .build/coopege-b2/A1_pinned.html
      - name: Compare same south-gate route in real Chromium (A1 vs B4)
        env:
          COOPEGE_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: node research/coopege-b2/compare.browser.mjs
      - name: Preserve game, screenshots, contracts and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coopege-b1-material-experience
          if-no-files-found: warn
          retention-days: 21
          path: |
            .build/coopege-b1/*.html
            .build/coopege-b1/*.png
            .build/coopege-b2/*.png
            .build/coopege-b2/same-place-observations.json
            .build/coopege-b0/semantic-boundary.json
            .build/coopege-b0/source-authored-witness.json
            .build/coopege-b0/place-network.json
